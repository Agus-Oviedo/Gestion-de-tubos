name: Publicacion compatible con Chrome 109

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'GestionTubos.*/**'
      - 'tests/Navegador/**'
      - 'tests/Respaldos/**'
      - 'tools/RecuperarRespaldo/**'
      - 'scripts/versionar-estilos.py'
      - '.github/workflows/publicar-compatible.yml'

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Seleccionar el SDK de .NET 8 para toda la compilacion
        run: echo '{"sdk":{"version":"8.0.415","rollForward":"disable"}}' > global.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.415'
      - name: Instalar herramientas WebAssembly
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Compilar publicacion
        run: dotnet publish GestionTubos.Api/GestionTubos.Api.csproj -c Release -o .publish/chrome109
      - name: Versionar estilos para evitar hojas antiguas en cache
        run: python3 scripts/versionar-estilos.py .publish/chrome109/wwwroot
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium 109 para la prueba de arranque
        run: |
          npm install --prefix .build-check/browser playwright@1.29.2
          .build-check/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verificar inicio en Chromium 109
        env:
          NODE_PATH: ./.build-check/browser/node_modules
        run: |
          python3 -m http.server 8765 --directory .publish/chrome109/wwwroot > /tmp/gestion-tubos-http.log 2>&1 &
          node tests/Navegador/inicio.cjs
          node tests/Navegador/respaldo-local.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: monsterasp-chrome109
          path: .publish/chrome109/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: capturas-chrome109
          path: .build-check/capturas/
          retention-days: 7
          if-no-files-found: error

  recuperar:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: 'Prueba_Respaldo_2026!Local'
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - name: Seleccionar SDK
        run: echo '{"sdk":{"version":"8.0.415","rollForward":"disable"}}' > global.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.415'
      - name: Exportar y recuperar en SQL Server separado
        env:
          RESPALDOS_TEST_SQL: 'Server=localhost,1433;User Id=sa;Password=Prueba_Respaldo_2026!Local;Encrypt=True;TrustServerCertificate=True;Connect Timeout=5'
        run: dotnet run --project tests/Respaldos/Respaldos.csproj
      - name: Compilar herramienta de recuperacion
        run: dotnet build tools/RecuperarRespaldo/RecuperarRespaldo.csproj -c Release
